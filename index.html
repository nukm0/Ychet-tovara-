<!DOCTYPE html>
<html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Учёт товара</title><link rel="stylesheet" href="style.css">
<body><header><a class="brand" href="#">◈ <span>Учёт товара<small>ЛИЧНЫЙ СКЛАД</small></span></a><button id="add">＋ Добавить товар</button></header><main><div class="intro"><div><p class="eyebrow">ВСЁ ПОД КОНТРОЛЕМ</p><h1>Мой склад</h1><p class="muted">Товары, вкусы и деньги — в одном месте.</p></div><span class="badge">● Сохранение на этом устройстве</span></div><div id="stats" class="stats"></div><section class="toolbar"><input id="search" type="search" placeholder="Поиск товара или вкуса…" aria-label="Поиск"><select id="filter" aria-label="Фильтр остатков"><option value="all">Все товары</option><option value="stock">В наличии</option><option value="empty">Закончились</option></select></section><div id="cards" class="cards"></div><section class="history"><h2>Последние операции</h2><div id="history"></div></section><footer><span>Данные хранятся в браузере. Между устройствами пока не синхронизируются.</span><div><button class="secondary" id="export">Скачать резервную копию</button><label class="filebtn">Восстановить<input id="import" type="file" accept="application/json,.json" hidden></label></div></footer></main><dialog id="modal"><div id="modalContent"></div></dialog><div id="toast" role="status"></div><script src="app.js"></script></body></html>
